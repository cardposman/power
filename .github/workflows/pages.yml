name: Build and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test routing and source data
        run: node --test scripts/test-stations.cjs scripts/test-routes.cjs scripts/test-layout.cjs scripts/test-categories.cjs scripts/test-favicon.cjs
      - name: Verify grouped source pages
        run: python3 scripts/check-generated.py
      - name: Build short-URL deployment
        run: node scripts/build-pages.cjs
      - name: Verify deployment pages
        run: python3 scripts/check-generated.py --directory _site
      - name: Upload generated output only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated artifact
        id: deployment
        uses: actions/deploy-pages@v4
